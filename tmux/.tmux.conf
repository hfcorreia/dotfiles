set -g prefix C-a
unbind C-b

set-window-option -g mode-keys vi

set -g default-terminal "screen-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-sessionist'
set -g @plugin 'tmux-plugins/tmux-pain-control'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-processes 'false'
set -g @resurrect-dir '~/.tmux/resurrect'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '10'

set -g @plugin 'christoomey/vim-tmux-navigator'

set -g @plugin 'tmux-plugins/tmux-yank'

set -g @plugin 'catppuccin/tmux'

# catppuccin config
set -g @catppuccin_window_left_separator "█"
set -g @catppuccin_window_right_separator "█ "
set -g @catppuccin_window_middle_separator " | "
set -g @catppuccin_window_number_position "right"

set -g @catppuccin_window_default_fill "none"
set -g @catppuccin_window_default_text "#W"

set -g @catppuccin_window_current_fill "all"
set -g @catppuccin_window_current_text "#W"

set -g @catppuccin_status_modules_right "session user host date_time"
set -g @catppuccin_status_left_separator  "█"
set -g @catppuccin_status_right_separator "█"
set -g @catppuccin_status_right_separator_inverse "no"
set -g @catppuccin_status_fill "all"
set -g @catppuccin_status_connect_separator "no"

set -g set-clipboard on
set -g allow-passthrough on

set -g status-left-length 50

set -g @catppuccin_directory_text "#{pane_current_path}"

run -b '/opt/homebrew/opt/tpm/share/tpm/tpm'

# Custom keybindings (after TPM to avoid plugin overrides)
bind Tab switch-client -l
bind s display-popup -E "~/.local/bin/tmux-session-manager"
bind u display-popup -w 90% -h 80% -E "~/.local/bin/tmux-claude-containers"
bind d display-popup -w 90% -h 80% -E "~/.local/bin/tmux-podman-containers"
bind g display-popup -E -d "#{pane_current_path}" -w 90% -h 90% "~/.local/bin/tmux-lazygit"

# tmux-sessionist binds prefix+g to "switch to session" and loads
# asynchronously via tpm (run -b), so it can clobber the binding above
# after this file has already been sourced. Re-apply it once plugins
# have had time to finish loading.
run-shell -b 'sleep 0.3 && tmux bind g display-popup -E -d "##{pane_current_path}" -w 90% -h 90% "~/.local/bin/tmux-lazygit"'
